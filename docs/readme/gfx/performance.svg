<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Nightfire Rust vs PCSX2 performance, 2026-10-21</title>
  <rect x="0.5" y="0.5" width="879" height="599" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="40" font-size="20" font-weight="600" fill="#1f2328">Port vs PCSX2 on the same PC</text>
  <text x="856" y="40" font-size="12" fill="#656d76" text-anchor="end">measured 2026-10-21</text>
  <text x="24" y="62" font-size="12" fill="#656d76">AMD Ryzen 9 7900X, NVIDIA GeForce RTX 4090, Windows 10. The Exchange, first level (07000005), the level start view.</text>
  <text x="24" y="79" font-size="12" fill="#656d76">PCSX2 2.8.2: Vulkan, 4x internal resolution (2048x1792). Port: renders natively at the window size.</text>

  <!-- key -->
  <g font-size="12" fill="#656d76">
    <rect x="24" y="94" width="18" height="12" rx="2" fill="#8c959f"/>
    <text x="48" y="104">PCSX2</text>
    <rect x="104" y="94" width="18" height="12" rx="2" fill="#2f6fcf"/>
    <text x="128" y="104">Nightfire Rust</text>
  </g>

  <!-- ===== Panel 1: fastest frame rate ===== -->
  <text x="24" y="138" font-size="15" font-weight="600" fill="#1f2328">Fastest frame rate, limiter off</text>
  <text x="24" y="156" font-size="11.5" fill="#656d76">frames per second; PCSX2 from its own overlay, the port from its frame log (10 s, median of 3 runs)</text>
  <!-- scale: 1300 fps = 600 px -->
  <text x="24" y="185" font-size="13" fill="#1f2328">PCSX2</text>
  <rect x="110" y="172" width="51" height="20" rx="3" fill="#8c959f"/>
  <text x="169" y="187" font-size="13" font-weight="600" fill="#1f2328">110 fps</text>
  <text x="24" y="215" font-size="13" fill="#1f2328">Port</text>
  <rect x="110" y="202" width="563" height="20" rx="3" fill="#2f6fcf"/>
  <text x="681" y="217" font-size="13" font-weight="600" fill="#1f2328">1,220 fps</text>
  <text x="110" y="240" font-size="11.5" fill="#656d76">Port at other window sizes: 1,209 fps at 1920x1080, 1,210 at 1280x720 (2543x1400 above: the largest window the desktop allows).</text>

  <!-- ===== Panel 2: CPU at 240 Hz ===== -->
  <text x="24" y="282" font-size="15" font-weight="600" fill="#1f2328">CPU needed to hold 240 fps (240 Hz monitor, vsync)</text>
  <text x="24" y="300" font-size="11.5" fill="#656d76">share of one core, process CPU time over 10 s</text>
  <!-- scale: 100 % = 400 px -->
  <text x="24" y="329" font-size="13" fill="#1f2328">PCSX2</text>
  <text x="110" y="331" font-size="13" fill="#1f2328">can't reach 240 fps (tops out at 110; at the game's 60 fps it uses 81 % of a core)</text>
  <text x="24" y="359" font-size="13" fill="#1f2328">Port</text>
  <rect x="110" y="346" width="132" height="20" rx="3" fill="#2f6fcf"/>
  <text x="250" y="361" font-size="13" font-weight="600" fill="#1f2328">33 %</text>

  <!-- ===== Panel 3: every level ===== -->
  <text x="24" y="403" font-size="15" font-weight="600" fill="#1f2328">Every on-foot story level, 1920x1080, limiter off</text>
  <text x="24" y="421" font-size="11.5" fill="#656d76">average frame time at each level's start view (21 levels); 240 Hz needs 4.17 ms or less</text>
  <!-- scale: 5 ms = 600 px -->
  <rect x="110" y="434" width="600" height="20" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="110" y="434" width="68" height="20" rx="3" fill="#2f6fcf"/>
  <rect x="178" y="434" width="140" height="20" fill="#dbe6f6"/>
  <line x1="610" y1="428" x2="610" y2="460" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="610" y="474" font-size="11" fill="#cf222e" text-anchor="middle">4.17 ms (240 fps)</text>
  <text x="24" y="449" font-size="13" fill="#1f2328">Port</text>
  <text x="110" y="474" font-size="11" fill="#656d76">0.57 ms (07000004)</text>
  <text x="330" y="449" font-size="11.5" fill="#1f2328">slowest: 1.73 ms, 579 fps (07000012)</text>

  <!-- ===== Panel 4: today's fix ===== -->
  <text x="24" y="514" font-size="15" font-weight="600" fill="#1f2328">Found while measuring</text>
  <text x="24" y="534" font-size="12" fill="#656d76">A debug switch was being looked up once per culled draw. Removing that took 07000015 from 7.17 ms to 1.42 ms,</text>
  <text x="24" y="551" font-size="12" fill="#656d76">07000007 from 5.18 to 1.13 and 07000012 from 5.00 to 1.73: the three levels that had dropped under 240 fps.</text>
  <text x="24" y="580" font-size="11.5" fill="#656d76">PCSX2's frame rate is emulation speed (at 183 % the whole game runs 1.83x fast); the port keeps game logic at 60 Hz and draws interpolated frames.</text>
</svg>
