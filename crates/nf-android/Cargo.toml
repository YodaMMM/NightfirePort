[package]
name = "nf-android"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Thin JNI + Vulkan/wgpu Android bridge (libdxandroid.so) for NightfirePort"

[lib]
name = "dxandroid"
crate-type = ["cdylib"]

[dependencies]
nf-formats = { path = "../nf-formats" }
nf-game = { path = "../nf-game" }
nf-view = { path = "../nf-view" }
nf-audio = { path = "../nf-audio" }
anyhow.workspace = true
wgpu = "30.0.1"
pollster = "1.0.1"
glam = "0.34.1"
raw-window-handle = "0.6"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-sys = "0.6"
android_logger = "0.14"
