[package]
name = "nf-macos"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native macOS Metal engine wrapper and CLI verification harness for NightfirePort"

[lib]
name = "nfmacos"

[[bin]]
name = "nf-macos-harness"
path = "src/bin/nf-macos-harness.rs"

[dependencies]
nf-formats = { path = "../nf-formats" }
nf-game = { path = "../nf-game" }
nf-view = { path = "../nf-view" }
nf-audio = { path = "../nf-audio" }
anyhow.workspace = true
wgpu = "30.0.1"
pollster = "1.0.1"
glam = "0.34.1"
log = "0.4"
winit = "0.30.13"
